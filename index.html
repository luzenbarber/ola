 <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Historia de Amor Pixel</title>
  <style>
    body {
      background: black;
      margin: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      background: #222;
    }
    #yesButton {
      display: none;
      margin: 20px auto;
      padding: 10px 20px;
      font-size: 18px;
      background: pink;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="700" height="400"></canvas>
  <button id="yesButton">Sí 💖</button>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const yesButton = document.getElementById("yesButton");

    let frame = 0;
    let stage = 0;

    const person1 = { x: 50, y: 300, color: "#ff69b4" };
    const person2 = { x: 110, y: 300, color: "#87cefa" };
    const cinema = { x: 80, y: 80, width: 540, height: 220 };

    const fireworks = [];
    const floatingHearts = [];

    // corazones flotantes
    for (let i = 0; i < 30; i++) {
      floatingHearts.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 5 + 3,
        speed: Math.random() * 0.5 + 0.2
      });
    }

    function drawPerson(x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, 10, 10);
      ctx.fillRect(x, y + 10, 10, 15);
    }

    function drawHeart(x, y, size = 3) {
      ctx.fillStyle = "red";
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.arc(x + size * 2, y, size, 0, Math.PI * 2);
      ctx.moveTo(x - size, y + 2);
      ctx.lineTo(x + size, y + size * 3);
      ctx.lineTo(x + size * 3, y + 2);
      ctx.fill();
    }

    function drawText(text, size = "20px", yOffset = 50, color = "white") {
      ctx.fillStyle = color;
      ctx.font = `${size} pixel, sans-serif`;
      ctx.textAlign = "center";
      ctx.fillText(text, canvas.width / 2, yOffset);
    }

    function drawCinema() {
      // cuerpo del cine
      ctx.fillStyle = "#333";
      ctx.fillRect(cinema.x, cinema.y, cinema.width, cinema.height);

      // pantalla gigante
      const pad = 20;
      ctx.fillStyle = "black";
      ctx.fillRect(
        cinema.x + pad,
        cinema.y + pad,
        cinema.width - pad * 2,
        cinema.height / 2
      );
      // ícono de “play”
      ctx.fillStyle = "white";
      ctx.beginPath();
      const sx = cinema.x + cinema.width / 2 - 20;
      const sy = cinema.y + pad + (cinema.height / 2) / 2 - 20;
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx, sy + 40);
      ctx.lineTo(sx + 35, sy + 20);
      ctx.closePath();
      ctx.fill();

      // sillas centradas: 4 filas × 12 columnas
      ctx.fillStyle = "gray";
      const cols = 12, rows = 4, w = 25, h = 12, spacing = 5;
      const totalW = cols * w + (cols - 1) * spacing;
      const startX = cinema.x + (cinema.width - totalW) / 2;
      const startY = cinema.y + pad + cinema.height / 2 + 20;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          ctx.fillRect(
            startX + c * (w + spacing),
            startY + r * (h + spacing),
            w, h
          );
        }
      }

      // puertas
      ctx.fillStyle = "red";
      ctx.fillRect(cinema.x + 5, cinema.y + cinema.height - 30, 20, 30);
      ctx.fillStyle = "green";
      ctx.fillRect(cinema.x + cinema.width - 25, cinema.y + cinema.height - 30, 20, 30);
    }

    function drawCinemaMessage(line1, line2 = "") {
      ctx.fillStyle = "white";
      ctx.font = "18px pixel, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(line1, canvas.width / 2, cinema.y + 40);
      if (line2) ctx.fillText(line2, canvas.width / 2, cinema.y + 60);
    }

    function updateFloatingHearts() {
      for (let h of floatingHearts) {
        h.y -= h.speed;
        if (h.y < -10) {
          h.y = canvas.height + 10;
          h.x = Math.random() * canvas.width;
        }
        drawHeart(h.x, h.y, h.size);
      }
    }

    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      updateFloatingHearts();

      if (stage === 0) {
        drawCinema();
        drawCinemaMessage(" 𝐄𝐧 𝐞𝐥 𝐜𝐢𝐧𝐞 𝐜𝐨𝐢𝐧𝐜𝐢𝐝𝐢𝐦𝐨𝐬 𝐝𝐞 𝐧𝐮𝐞𝐯𝐨");
        if (person2.x > person1.x + 10) {
          person1.x += 0.2;
          person2.x -= 0.2;
        } else {
          if (frame < 120) frame++;
          else { stage = 1; frame = 0; }
        }
        drawPerson(person1.x, person1.y, person1.color);
        drawPerson(person2.x, person2.y, person2.color);
      }
      else if (stage === 1) {
        drawCinema();
        drawCinemaMessage(" 𝐂𝐨𝐧𝐞𝐜𝐭𝐚𝐦𝐨𝐬 𝐜𝐨𝐧 𝐮𝐧 𝐛𝐞𝐬𝐨");
        drawPerson(person1.x, person1.y, person1.color);
        drawPerson(person2.x, person2.y, person2.color);
        if (frame % 40 < 20) drawHeart((person1.x + person2.x) / 2, person1.y - 10);
        frame++;
        if (frame > 200) { stage = 2; frame = 0; }
      }
      else if (stage === 2) {
        person1.x -= 0.5; person2.x += 0.5;
        drawCinema();
        drawCinemaMessage(" 𝐃𝐞𝐬𝐩𝐮é𝐬, 𝐭𝐮𝐯𝐢𝐦𝐨𝐬 𝐧𝐮𝐞𝐬𝐭𝐫𝐨𝐬 𝐦𝐚𝐥𝐨𝐬 𝐦𝐨𝐦𝐞𝐧𝐭𝐨𝐬", "𝐲 𝐝𝐢𝐟𝐞𝐫𝐞𝐧𝐜𝐢𝐚𝐬...");
        drawPerson(person1.x, person1.y, person1.color);
        drawPerson(person2.x, person2.y, person2.color);
        frame++;
        if (frame > 150) { stage = 3; frame = 0; }
      }
      else if (stage === 3) {
        person1.x += 0.2; person2.x -= 0.2;
        drawCinema();
        drawCinemaMessage(
           "𝐍𝐨𝐬 𝐫𝐞𝐜𝐨𝐧𝐜𝐢𝐥𝐢𝐚𝐦𝐨𝐬 𝐲 𝐟𝐨𝐫𝐦𝐚𝐦𝐨𝐬 𝐚𝐥𝐠𝐨 𝐡𝐞𝐫𝐦𝐨𝐬𝐨",
            "𝐄𝐬𝐭𝐚 𝐜𝐥𝐚𝐫𝐨 𝐲 𝐧𝐨 𝐞𝐬 𝐮𝐧 𝐬𝐞𝐜𝐫𝐞𝐭𝐨 𝐪𝐮𝐞 𝐞𝐬𝐭𝐨𝐲 𝐞𝐧𝐚𝐦𝐨𝐫𝐚𝐝𝐨 𝐝𝐞 𝐭𝐢 💖"
        );
        drawPerson(person1.x, person1.y, person1.color);
        drawPerson(person2.x, person2.y, person2.color);
        ctx.strokeStyle = "pink";
        ctx.beginPath();
        ctx.moveTo(person1.x + 5, person1.y + 15);
        ctx.lineTo(person2.x + 5, person2.y + 15);
        ctx.stroke();
        frame++;
        if (frame > 200) { stage = 4; frame = 0; }
      }
      else if (stage === 4) {
        person1.x = canvas.width / 2 - 20;
        person2.x = canvas.width / 2 + 10;
        drawCinema();
        drawPerson(person1.x, person1.y, person1.color);
        drawPerson(person2.x, person2.y, person2.color);
        ctx.strokeStyle = "pink";
        ctx.beginPath();
        ctx.moveTo(person1.x + 10, person1.y + 15);
        ctx.lineTo(person2.x, person2.y + 15);
        ctx.stroke();
        drawText(" ¿𝐐𝐮𝐢𝐞𝐫𝐞𝐬 𝐯𝐨𝐥𝐯𝐞𝐫 𝐚 𝐬𝐞𝐫 𝐦𝐢 𝐧𝐨𝐯𝐢𝐚?", "24px", 100);
        if (frame % 40 < 20) drawHeart((person1.x + person2.x + 10) / 2, person1.y - 20);
        frame++;
        if (frame === 60) yesButton.style.display = "block";
      }
      else if (stage === 5) {
        for (let fw of fireworks) {
          fw.y -= fw.speedY; fw.x += fw.speedX; fw.life--;
          ctx.beginPath();
          ctx.fillStyle = fw.color;
          ctx.arc(fw.x, fw.y, fw.radius, 0, Math.PI * 2);
          ctx.fill();
        }
        drawPerson(canvas.width / 2 - 10, person1.y, person1.color);
        drawPerson(canvas.width / 2, person2.y, person2.color);
        ctx.strokeStyle = "white";
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2 - 2, person1.y + 15);
        ctx.lineTo(canvas.width / 2 + 10, person2.y + 15);
        ctx.stroke();
        if (frame % 30 < 15) {
          drawHeart(canvas.width / 2 - 5, person1.y - 25, 4);
          drawHeart(canvas.width / 2 + 5, person2.y - 30, 4);
        }
        drawText("¡Te amo! pequeña chicken 💖", "24px", 80, "pink");
        frame++;
      }

      requestAnimationFrame(update);
    }

    yesButton.addEventListener("click", () => {
      yesButton.style.display = "none";
      frame = 0;
      stage = 5;
      for (let i = 0; i < 50; i++) {
        fireworks.push({
          x: canvas.width / 2,
          y: canvas.height,
          radius: Math.random() * 3 + 2,
          color: `hsl(${Math.random() * 360},100%,70%)`,
          speedX: Math.random() * 4 - 2,
          speedY: Math.random() * -3 - 1,
          life: Math.random() * 50 + 30
        });
      }
    });

    update();
  </script>
</body>
</html>
